[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NEXT_PUBLIC_CASKFOLIO_IMAGE_CDN = "true"

[images]
  remote_images = [
    "https://atrjypugrnmnbgxockeu\\.supabase\\.co/.*",
    "https://d1e2y5wc27crnp\\.cloudfront\\.net/.*",
    "https://(?:www\\.)?whiskyadvocate\\.com/.*",
    "https://(?:www\\.)?woodencork\\.com/.*",
  ]

[[redirects]]
  from = "/__admin/status"
  to = "/.netlify/functions/admin-status"
  status = 200
  force = true

[[redirects]]
  from = "/__admin/reference-sync"
  to = "/.netlify/functions/admin-reference-sync"
  status = 200
  force = true

[[redirects]]
  from = "/__admin/news-import"
  to = "/.netlify/functions/news-import"
  status = 200
  force = true

[[redirects]]
  from = "/__admin/news-import/status"
  to = "/.netlify/functions/news-import-status"
  status = 200
  force = true

[[redirects]]
  from = "/__reference/sync-bottle"
  to = "/.netlify/functions/reference-sync-bottle"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co https://www.google-analytics.com https://region1.google-analytics.com https://www.googletagmanager.com; form-action 'self' https://*.supabase.co; base-uri 'self'; frame-ancestors 'none'; object-src 'none';"
